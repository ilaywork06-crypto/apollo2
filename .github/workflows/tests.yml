name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend tests (Python)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (including dev group)
        run: uv sync --group dev

      # ── Unit tests ──────────────────────────────────────────────────────────
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short --junitxml=reports/unit-results.xml

      # ── Integration tests ────────────────────────────────────────────────────
      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short --junitxml=reports/integration-results.xml

      # ── System tests (use real data files) ──────────────────────────────────
      - name: Run system tests
        run: uv run pytest tests/system/ -v --tb=short --junitxml=reports/system-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend tests (Node / Jest)
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run frontend tests (no watch, with coverage)
        run: npm test -- --watchAll=false --coverage --coverageReporters=text --coverageReporters=lcov
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/web/coverage/
          retention-days: 14
