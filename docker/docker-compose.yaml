services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apollo
      POSTGRES_USER: apollo
      POSTGRES_PASSWORD: apollo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://apollo:apollo@db:5432/apollo
    ports:
      - "8000:8000"
    volumes:
      - ../src:/app/src
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/web/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
